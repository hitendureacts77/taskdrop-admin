<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskDrop Admin Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f2f1;--surface:#fff;--sunk:#f7f7f6;--line:#e4e5e3;--line2:#d3d5d2;
  --ink:#16171a;--ink2:#3f4240;--muted:#676b68;
  --jade:#0e8f72;--jade-t:#0a6f58;--jade-s:#e8f5f0;--jade-l:#bfe3d5;
  --blue:#2f5bea;--blue-t:#1e40af;--blue-s:#edf2fe;--blue-l:#c9d6fb;
  --gold:#e0a85a;--gold-t:#7d5210;--gold-s:#fbf2e2;--gold-l:#efd9ae;
  --orange:#e0724a;--orange-t:#b0482a;--orange-s:#fcefe9;--orange-l:#f3cdbe;
  --red:#c0322b;--red-t:#a3241e;--red-s:#fdecea;--red-l:#f4c3bf;
  --side:#062b22;--side-ink:#cfe5dd;--side-muted:#86a89c;--side-active:#0e3b30;
  --shadow:0 1px 2px rgba(16,24,20,.05),0 4px 16px rgba(16,24,20,.05);
  --r:14px;--rc:10px;
}
:root[data-theme="dark"]{
  --bg:#0e1311;--surface:#161c1a;--sunk:#121816;--line:#26302c;--line2:#34403b;
  --ink:#eef1ef;--ink2:#c9cfcc;--muted:#9aa5a0;
  --jade:#2fb592;--jade-t:#4fcfa9;--jade-s:rgba(47,181,146,.14);--jade-l:rgba(47,181,146,.35);
  --blue:#5b7cff;--blue-t:#8ea9ff;--blue-s:rgba(91,124,255,.15);--blue-l:rgba(91,124,255,.38);
  --gold:#e8b46a;--gold-t:#f0c27f;--gold-s:rgba(232,180,106,.14);--gold-l:rgba(232,180,106,.38);
  --orange:#f08560;--orange-t:#ff9d78;--orange-s:rgba(240,133,96,.14);--orange-l:rgba(240,133,96,.4);
  --red:#ff6b61;--red-t:#ff7b72;--red-s:rgba(255,107,97,.13);--red-l:rgba(255,107,97,.4);
  --side:#0a120f;--side-ink:#d5e6df;--side-muted:#7f978d;--side-active:#13241e;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.num,td,.big{font-variant-numeric:tabular-nums}
a{color:var(--blue-t);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:var(--rc);padding:9px 11px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ribbon */
.ribbon{position:sticky;top:0;z-index:60;background:repeating-linear-gradient(135deg,#e0a85a 0 14px,#d89a45 14px 28px);color:#3a2604;font-weight:700;font-size:12.5px;text-align:center;padding:5px 12px;letter-spacing:.02em}
.ribbon b{background:#3a2604;color:#fbe7c4;padding:1px 7px;border-radius:5px;margin-right:6px}
body.prod .ribbon{display:none}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:var(--side);color:var(--side-ink);position:sticky;top:27px;height:calc(100vh - 27px);overflow-y:auto;display:flex;flex-direction:column;transition:width .2s}
body.prod .side{top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:800;font-size:17px;color:#fff}
.logo .mark{width:32px;height:32px;border-radius:9px;background:var(--jade);display:grid;place-items:center;flex:none}
.logo small{display:block;font-weight:600;font-size:11px;color:var(--side-muted)}
.nav{padding:4px 10px;flex:1}
.ng{margin-bottom:2px}
.nl{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--side-ink);font-weight:600;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.nl:hover{background:rgba(255,255,255,.06)}
.nl.on{background:var(--side-active);color:#fff}
.nl .cnt{margin-left:auto;background:var(--orange);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.nl .chev{margin-left:auto;opacity:.6;transition:transform .2s}
.ng.open .chev{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 6px 39px}
.ng.open .sub{display:block}
.sub a{display:flex;align-items:center;gap:6px;color:var(--side-muted);padding:6px 10px;border-radius:7px;font-size:13.5px;font-weight:500}
.sub a:hover{color:#fff}
.sub a.on{color:#fff;background:rgba(255,255,255,.07)}
.sub a.locked{opacity:.55}
.sub a .lk{width:13px;height:13px;margin-left:auto}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--side-muted)}
.side-foot a{color:var(--side-muted);text-decoration:underline}
.collapse-btn{margin:6px 10px 10px;background:none;border:1px solid rgba(255,255,255,.12);color:var(--side-muted);border-radius:8px;padding:7px;display:flex;align-items:center;gap:8px;font-size:12.5px}
body.collapsed .side{width:72px}
body.collapsed .side .txt,body.collapsed .side .sub,body.collapsed .side .chev,body.collapsed .logo small,body.collapsed .logo span,body.collapsed .side-foot{display:none}
body.collapsed .nl{justify-content:center;position:relative}
body.collapsed .nl .cnt{position:absolute;top:2px;right:4px;padding:0 5px}

.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:27px;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px}
body.prod .top{top:0}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;padding-left:36px;background:var(--surface);border-radius:999px}
.search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);padding:6px;display:none;max-height:70vh;overflow:auto;z-index:80}
.sres.show{display:block}
.sres h6{margin:8px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sres a{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink)}
.sres a:hover,.sres a.hl{background:var(--sunk)}
.sres a small{color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:999px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;position:relative}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;background:var(--orange);color:#fff;border-radius:999px;font-size:10px;font-weight:800;padding:0 5px;line-height:16px}
.switch-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;user-select:none}
.mfa-chip{background:var(--gold-s);border-color:var(--gold-l);color:var(--gold-t)}
.mfa-chip.ok{background:var(--jade-s);border-color:var(--jade-l);color:var(--jade-t)}
.envbadge{display:none;font-size:12px;font-weight:700;color:var(--jade-t);background:var(--jade-s);border:1px solid var(--jade-l);padding:4px 10px;border-radius:999px}
body.prod .envbadge{display:inline-block}
.menu-btn{display:none}
main{padding:24px;max-width:1280px;width:100%;margin:0 auto}

/* page */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 4px;font-size:16px;font-weight:700}
.card .sub-t{color:var(--muted);font-size:13px;margin:0 0 14px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.ch h3{margin:0}
.card.newc{border:2px dashed var(--line2);background:var(--sunk);box-shadow:none}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.tile .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
.tile .foot{font-size:12.5px;color:var(--muted)}
.tile.gold{background:var(--gold-s);border-color:var(--gold-l)} .tile.gold .big{color:var(--gold-t)}
.tile.jade .big{color:var(--jade-t)} .tile.blue .big{color:var(--blue-t)}
.tile.orange{background:var(--orange-s);border-color:var(--orange-l)} .tile.orange .big{color:var(--orange-t)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--jade-t);background:var(--jade-s);border-color:var(--jade-l)}
.pill.earn{color:var(--blue-t);background:var(--blue-s);border-color:var(--blue-l)}
.pill.wait{color:var(--gold-t);background:var(--gold-s);border-color:var(--gold-l)}
.pill.bad{color:var(--orange-t);background:var(--orange-s);border-color:var(--orange-l)}
.pill.danger{color:var(--red-t);background:var(--red-s);border-color:var(--red-l)}
.pill.mut{color:var(--muted);background:var(--sunk);border-color:var(--line)}
.pill.nodot::before{display:none}
.newtag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px dashed var(--muted);color:var(--ink2);white-space:nowrap}
.testtag{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#6b4a00;background:#ffe9a8;border-radius:5px;padding:1px 6px;margin-left:6px}
:root[data-theme="dark"] .testtag{background:#5a4512;color:#ffe3a1}
.xtag{font-size:11px;font-weight:800;color:var(--red-t);background:var(--red-s);border:1px solid var(--red-l);border-radius:6px;padding:1px 7px;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--rc);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:700;padding:9px 15px;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--jade-t);border-color:var(--jade-t);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.earn{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.warn{background:var(--orange-t);border-color:var(--orange-t);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
:root[data-theme="dark"] .btn.pri{background:#138a6d;border-color:#138a6d}
:root[data-theme="dark"] .btn.danger{background:#c0322b;border-color:#c0322b}
:root[data-theme="dark"] .btn.warn{background:#b8502f;border-color:#b8502f}
.btn.ghost{background:none;border-color:transparent;color:var(--blue-t);padding:6px 8px;min-height:30px}
.btn.sm{padding:5px 11px;min-height:32px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn .lk{width:14px;height:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12.5px}
.stack>*+*{margin-top:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 12px;color:var(--muted);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs .on{color:var(--ink);border-bottom-color:var(--jade)}
.tabs .c{font-size:11px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;color:var(--ink2);white-space:nowrap;font-size:13px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip b{font-weight:800;margin-left:4px}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl .r{text-align:right}
.tblwrap{margin:0 -20px -20px;}
.tblwrap .tbl th:first-child,.tblwrap .tbl td:first-child{padding-left:20px}
.tblwrap .tbl th:last-child,.tblwrap .tbl td:last-child{padding-right:20px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:#fff}
.av.h{background:var(--jade)} .av.e{background:var(--blue)} .av.b{background:linear-gradient(135deg,var(--jade) 50%,var(--blue) 50%)} .av.t{background:#a3a3a3}
.av.lg{width:64px;height:64px;font-size:22px}
.who b{display:block;font-weight:700}
.who small{color:var(--muted);display:block}

body.hide-test .is-test{display:none!important}

/* inbox */
.ibx{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.ibx:last-child{border-bottom:0}
.ibx .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.ic.m{background:var(--gold-s);color:var(--gold-t)} .ic.d{background:var(--orange-s);color:var(--orange-t)} .ic.h{background:var(--blue-s);color:var(--blue-t)} .ic.s{background:var(--red-s);color:var(--red-t)} .ic.y{background:var(--sunk);color:var(--ink2)} .ic.c{background:var(--jade-s);color:var(--jade-t)}
.ibx .body{flex:1;min-width:0}
.ibx .t{font-weight:700}
.ibx .meta{color:var(--muted);font-size:13px}
.ibx .acts{display:flex;gap:6px;flex:none;align-items:center}
.wbar{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.wbar .tr{flex:0 1 160px;height:6px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.wbar .fi{height:100%;border-radius:99px}

/* banner */
.blocker{display:flex;gap:14px;align-items:center;background:var(--red-s);border:1px solid var(--red-l);color:var(--ink);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.blocker .ic2{width:36px;height:36px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.blocker b{color:var(--red-t)}
.note{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2)}
.note.gold{background:var(--gold-s);border-color:var(--gold-l)}
.note.blue{background:var(--blue-s);border-color:var(--blue-l)}

/* bars */
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.bars .b{flex:1;border-radius:6px 6px 2px 2px;background:var(--jade);min-width:0;position:relative}
.bars .b:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;background:var(--ink);color:var(--surface);padding:2px 6px;border-radius:5px;white-space:nowrap;margin-bottom:4px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.hbar .l{width:150px;flex:none;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:22px;background:var(--sunk);border-radius:6px;overflow:hidden;min-width:0}
.hbar .fi{height:100%;border-radius:6px}
.hbar .v{width:64px;text-align:right;font-weight:700;flex:none}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:10px 0 8px}
.meter{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.meter>div{height:100%}

/* toggle */
.tg{width:46px;height:26px;border-radius:99px;background:var(--line2);border:0;position:relative;flex:none;transition:background .15s;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tg.on{background:var(--jade)}
.tg.on::after{left:23px}
.tg.on.red{background:var(--red)}
.tg[disabled]{opacity:.45;cursor:not-allowed}
.swrow{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.swrow:last-child{border-bottom:0}
.swrow .tx{flex:1;min-width:0}
.swrow .tx b{font-weight:700}
.swrow .tx .d{color:var(--muted);font-size:13px}
.swrow .tx code{font-size:11.5px;color:var(--muted);background:var(--sunk);padding:1px 5px;border-radius:4px}
.swrow.blk{background:var(--red-s);border:1px solid var(--red-l);border-radius:12px;padding:14px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:8px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .e{position:relative;padding:0 0 14px}
.tl .e::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .e.j::before{border-color:var(--jade)} .tl .e.bl::before{border-color:var(--blue)} .tl .e.g::before{border-color:var(--gold)} .tl .e.o::before{border-color:var(--orange);background:var(--orange)}
.tl .e small{color:var(--muted);display:block}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;font-size:13.5px}
.msg.p{background:var(--jade-s);border:1px solid var(--jade-l);align-self:flex-start;border-bottom-left-radius:4px}
.msg.w{background:var(--blue-s);border:1px solid var(--blue-l);align-self:flex-end;border-bottom-right-radius:4px}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph-img{aspect-ratio:4/3;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line)}

.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:none}

/* ---------- router ---------- */
function route(){
  A={};an=0;
  const h=cur();const [s,a]=h.split('/');
  let html;
  try{
    if(s==='today'||!s)html=V.today();
    else if(s==='inbox')html=V.inbox();
    else if(s==='money')html=V.money(a||'overview');
    else if(s==='people')html=V.people();
    else if(s==='person')html=V.person(a);
    else if(s==='tasks')html=V.tasks();
    else if(s==='task')html=V.task(a);
    else if(s==='devices')html=V.devices();
    else if(s==='safety')html=V.safety(a||'reports');
    else if(s==='support')html=V.support(a);
    else if(s==='growth')html=V.growth(a||'segments');
    else if(V[s])html=V[s](a);
    else html=ph('Not found','')+card('',`<div class="empty"><b>This page does not exist</b><a href="#/today">Go to Today</a></div>`);
  }catch(err){console.error(err);html=card('',`<div class="empty"><b>Couldn't show this screen</b>${err.message}</div>`)}
  document.getElementById('main').innerHTML=html;
  renderNav(h);applyNums();
  document.body.classList.remove('drawer');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
if(innerWidth<760)document.getElementById('demo').classList.add('min');
route();
</script>
