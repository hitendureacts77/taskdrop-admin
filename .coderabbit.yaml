# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews pull requests. It only reviews the default branch (main)
# unless other base branches are listed here. All new work goes into
# redesigned-2.0, so that branch must be listed or its pull requests are skipped.
# Same setup as the app repo's .coderabbit.yaml.
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - '^redesigned-2\.0$'

  path_instructions:
    - path: 'src/**'
      instructions: |
        Every server action and API route checks the caller first (`requireAdmin` or
        `requireSeeing` in the auth helpers). Money actions also need the MFA gate.
        Admin actions that change data write to the audit log.
        The service-role key and API gateway secret are server only: never prefix them with
        `NEXT_PUBLIC_`, never log them, never send them to the browser.
        What a person may change is decided by their staff role, not by hiding a button.
        The database is shared with the old app until Phase 9: flag anything that depends on a
        dropped or renamed table, column or function.
    - path: 'src/lib/db/database.types.ts'
      instructions: |
        Generated by `npm run db:types`. Do not review line by line; flag only if it looks
        hand-edited.
    - path: '.github/workflows/**'
      instructions: |
        No secrets echoed in logs. Pin third-party actions.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

chat:
  auto_reply: true
