name: CI

# Runs on every push and on every Dependabot pull request, so a dependency
# update that breaks the panel (or brings in a known vulnerability) shows red.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: typecheck, audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: npm audit
        run: npm audit --audit-level=moderate

      # A build needs the public Supabase address to exist, not to be reachable.
      - name: build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
