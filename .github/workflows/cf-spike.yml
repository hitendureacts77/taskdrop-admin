name: Cloudflare spike build

# Plan task 5.12 step 6 (spike): builds the admin for Cloudflare Workers with
# @opennextjs/cloudflare on Linux (OpenNext's Windows support is partial: the
# build fails there on a symlink) and reports the Worker bundle size. Runs only
# on the spike branch or by hand. Nothing deploys: `wrangler deploy --dry-run`
# needs no Cloudflare token. The Vercel build is untouched.

on:
  push:
    branches: ['feat/5-12-admin-opennext']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cf-build:
    name: OpenNext Cloudflare build + bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Placeholders, as in ci.yml: the build needs the public address to exist, not to be reachable.
      - name: opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npx opennextjs-cloudflare build

      - name: bundle size (wrangler dry run)
        run: |
          npx wrangler deploy --dry-run --outdir .cf-dry 2>&1 | tee dry-run.log
          {
            echo '### Worker bundle size'
            echo '```'
            grep -iE 'Total Upload|gzip' dry-run.log || true
            echo '```'
            echo 'Largest files in the dry-run output:'
            echo '```'
            du -ah .cf-dry | sort -rh | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-next-build
          path: .open-next
          include-hidden-files: true
          retention-days: 3
