name: Secret scan

# Task 2.5 (docs/ULTIMATE_PLAN.md). gitleaks reads every change, and once a week the whole history.
# A key that reaches GitHub is treated as leaked, so this fails the check; it does not rotate anything.

on:
  pull_request:
  push:
    branches: [redesigned-2.0]
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the whole history, so the weekly run and each change see every commit
          persist-credentials: false

      # Pinned to a full commit (v2): this job reads the whole history, so it is third-party code with that access.
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
